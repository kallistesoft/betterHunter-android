name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # For keeping gradle/libs.versions.toml current (Google Maven can't be reached from every dev environment).
      - name: Latest Google Maven versions
        continue-on-error: true
        run: |
          for a in com/android/tools/build/gradle androidx/compose/compose-bom com/google/firebase/firebase-bom com/google/gms/google-services; do
            echo "$a: $(curl -s https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -o '<release>[^<]*' | cut -d'>' -f2)"
          done

      # Firebase is optional: without this secret the app builds with default feature flags.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi

      - name: Conventions
        run: scripts/check-conventions.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test --stacktrace

      # Every class needs 90% of its lines covered by the unit tests (KoverConventionPlugin). On failure, the report
      # (build/reports/kover/htmlUnit) is in the reports artifact.
      - name: Coverage
        run: ./gradlew :koverVerifyUnit :koverHtmlReportUnit

      # Compares the UI with the reference images in */src/test/screenshots (recorded by the "Record screenshots"
      # workflow). Skipped until references exist.
      - name: Screenshot tests
        run: |
          if find . -path '*/src/test/screenshots/*.png' | grep -q .; then
            ./gradlew verifyRoborazziDebug
          else
            echo "::notice::No screenshot references yet: run the Record screenshots workflow."
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Release signing is optional: without the secrets the release build is unsigned.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "BH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug and release
        env:
          BH_KEYSTORE_PASSWORD: ${{ secrets.BH_KEYSTORE_PASSWORD }}
          BH_KEY_ALIAS: ${{ secrets.BH_KEY_ALIAS }}
          BH_KEY_PASSWORD: ${{ secrets.BH_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: betterhunter-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/

  # Flow tests (app/src/androidTest) and the release smoke test (:smoketest) on an emulator. No google-services.json
  # here: Firebase stays off, so feature flags keep their defaults and no forced update can block the app.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator starts, so its boot time isn't spent compiling.
      - name: Build the apps and tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleQa :smoketest:assembleQa

      # The system image and a booted emulator snapshot are cached: downloading the image on every run is slow and
      # occasionally fails (corrupt archive), which isn't a test result.
      - name: Emulator cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: avd-35-google_apis-x86_64-pixel_6

      - name: Create the emulator and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Emulator snapshot created for the cache."

      - name: Flow tests and release smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest :smoketest:connectedQaAndroidTest

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            app/build/reports/androidTests
            smoketest/build/reports/androidTests
