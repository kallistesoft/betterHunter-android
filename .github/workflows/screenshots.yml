name: Record screenshots

# Records the reference images of every Compose preview on CI's machine (so they match what CI renders) and uploads
# them as the "screenshots" artifact. It commits nothing: scripts/record-screenshots.sh downloads them and commits them
# as the developer, so the PR's CI starts as for any push (a commit by the Actions bot would wait for an approval).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Record
        run: ./gradlew recordRoborazziDebug

      - name: Upload the reference images
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '**/src/test/screenshots/*.png'
          if-no-files-found: error
          retention-days: 7
